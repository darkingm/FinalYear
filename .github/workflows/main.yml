name: CI/CD — Test, Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  TEST_DB_USER: testuser
  TEST_DB_PASSWORD: testpassword
  TEST_DB_NAME: marketplace_test

jobs:
  # ============================================================
  # JOB 1 — Run tests (requires postgres service)
  # ============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/marketplace_test
      NODE_ENV: test
      JWT_SECRET: ci_test_jwt_secret_at_least_32_characters_xxx
      JWT_REFRESH_SECRET: ci_test_refresh_secret_at_least_32_chars_xxx
      HCAPTCHA_SECRET: test_bypass
      PORT: 3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/main-service/package-lock.json

      - name: Install psql client
        run: sudo apt-get install -y postgresql-client

      - name: Apply database schema
        run: |
          PGPASSWORD=testpassword psql \
            -h localhost -U testuser -d marketplace_test \
            -f init_database.sql/01_schema.sql
          echo "Schema applied."

      - name: Install main-service dependencies
        working-directory: backend/main-service
        run: npm ci

      - name: TypeScript compile check
        working-directory: backend/main-service
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: backend/main-service
        run: npm run test:ci

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/main-service/coverage/
          retention-days: 7

  # ============================================================
  # JOB 2 — Build & push Docker images
  # ============================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test                # Only build if tests passed
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push main-api
        uses: docker/build-push-action@v5
        with:
          context: ./backend/main-service
          file: ./backend/main-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-main-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-main-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push payment-api
        uses: docker/build-push-action@v5
        with:
          context: ./backend/payment-service
          file: ./backend/payment-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-payment-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-payment-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 3 — Deploy to VPS via SSH
  # ============================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push      # Only deploy if build succeeded
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout (needed for docker-compose files)
        uses: actions/checkout@v4

      - name: Copy updated SQL files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "init_database.sql/,docs/"
          target: "/root/services/FinalYear/"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /root/services/FinalYear/docker

            echo "=== Pulling latest images ==="
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} \
              docker compose -f docker-compose.prod.yml pull

            echo "=== Applying any DB schema changes ==="
            # Only re-apply schema if postgres container is already running
            if docker compose -f docker-compose.prod.yml ps postgres | grep -q "running"; then
              docker compose -f docker-compose.prod.yml exec -T postgres \
                psql -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-marketplace_db} \
                -c "SELECT 1" > /dev/null 2>&1 && echo "DB reachable, skipping schema re-apply" || true
            fi

            echo "=== Restarting services (zero-downtime) ==="
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} \
              docker compose -f docker-compose.prod.yml up -d \
                --remove-orphans \
                --no-deps \
                main-api payment-api frontend

            echo "=== Waiting for main-api health check ==="
            sleep 8
            curl -sf http://127.0.0.1:3001/health || (echo "main-api health check FAILED" && exit 1)

            echo "=== Cleaning up old images ==="
            docker image prune -f

            echo "=== Deployment completed successfully! ==="
            docker compose -f docker-compose.prod.yml ps

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployment succeeded for commit ${{ github.sha }}"
          else
            echo "Deployment FAILED for commit ${{ github.sha }}"
          fi
