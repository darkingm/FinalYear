name: CI/CD — Test, Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  TEST_DB_USER: testuser
  TEST_DB_PASSWORD: testpassword
  TEST_DB_NAME: marketplace_test
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ============================================================
  # JOB 0 — Detect which services changed
  # ============================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      main-api: ${{ steps.filter.outputs.main-api }}
      payment-api: ${{ steps.filter.outputs.payment-api }}
      ai-service: ${{ steps.filter.outputs.ai-service }}
      db-migrator: ${{ steps.filter.outputs.db-migrator }}
      tokenization: ${{ steps.filter.outputs.tokenization }}
      any-service: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.main-api == 'true' || steps.filter.outputs.payment-api == 'true' || steps.filter.outputs.ai-service == 'true' || steps.filter.outputs.db-migrator == 'true' || steps.filter.outputs.tokenization == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            main-api:
              - 'backend/main-service/**'
            payment-api:
              - 'backend/payment-service/**'
            ai-service:
              - 'backend/ai-service/**'
            db-migrator:
              - 'init_database.sql/**'
              - 'payment_init_database.sql/**'
            tokenization:
              - 'backend/tokenization-service/**'
            docker:
              - 'docker/**'

  # ============================================================
  # JOB 1 — Type-check & test (only services that changed)
  # ============================================================
  test:
    name: Test & Type-check
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/marketplace_test
      NODE_ENV: test
      JWT_SECRET: ci_test_jwt_secret_at_least_32_characters_xxx
      JWT_REFRESH_SECRET: ci_test_refresh_secret_at_least_32_chars_xxx
      HCAPTCHA_SECRET: test_bypass
      PORT: 3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/main-service/package-lock.json

      - name: Install psql client
        run: sudo apt-get install -y postgresql-client

      - name: Apply schema + migrations
        run: |
          echo "Applying base schema..."
          PGPASSWORD=testpassword psql -h localhost -U testuser -d marketplace_test \
            -f init_database.sql/schema.sql

          echo "Applying seed data..."
          PGPASSWORD=testpassword psql -h localhost -U testuser -d marketplace_test \
            -v ON_ERROR_STOP=0 -f init_database.sql/seed.sql || true

          echo "Applying versioned migrations..."
          for f in init_database.sql/migrations/*.sql; do
            echo "  → Applying $f"
            PGPASSWORD=testpassword psql -h localhost -U testuser -d marketplace_test \
              -v ON_ERROR_STOP=0 -f "$f" || true
          done
          echo "✓ Database ready"

      - name: Install & type-check main-service
        if: needs.changes.outputs.main-api == 'true'
        working-directory: backend/main-service
        run: |
          npm ci
          npx tsc --noEmit
          npm run test:ci

      - name: Install & type-check payment-service
        if: needs.changes.outputs.payment-api == 'true'
        working-directory: backend/payment-service
        run: |
          npm ci
          npx tsc --noEmit
          npm run test:ci

      - name: Install & type-check frontend
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run test:ci

  # ============================================================
  # JOB 2a — Build & Push Frontend (only if frontend changed)
  # ============================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.changes.outputs.frontend == 'true'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ============================================================
  # JOB 2b — Build & Push Main API
  # ============================================================
  build-main-api:
    name: Build Main API
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.changes.outputs.main-api == 'true'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/main-service
          file: ./backend/main-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-main-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-main-api:${{ github.sha }}
          cache-from: type=gha,scope=main-api
          cache-to: type=gha,mode=max,scope=main-api

  # ============================================================
  # JOB 2c — Build & Push Payment API
  # ============================================================
  build-payment-api:
    name: Build Payment API
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.changes.outputs.payment-api == 'true'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/payment-service
          file: ./backend/payment-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-payment-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-payment-api:${{ github.sha }}
          cache-from: type=gha,scope=payment-api
          cache-to: type=gha,mode=max,scope=payment-api

  # ============================================================
  # JOB 2d — Build & Push Infra (AI, DB Migrator, Tokenization)
  # ============================================================
  build-infra:
    name: Build Infra Services
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      (needs.changes.outputs.ai-service == 'true' ||
       needs.changes.outputs.db-migrator == 'true' ||
       needs.changes.outputs.tokenization == 'true')
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3

      - name: Build & Push AI service
        if: needs.changes.outputs.ai-service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend/ai-service
          file: ./backend/ai-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-ai-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-ai-service:${{ github.sha }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service

      - name: Build & Push DB migrator
        if: needs.changes.outputs.db-migrator == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./init_database.sql
          file: ./init_database.sql/Dockerfile.migrator
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-db-migrator:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-db-migrator:${{ github.sha }}
          cache-from: type=gha,scope=db-migrator
          cache-to: type=gha,mode=max,scope=db-migrator

      - name: Build & Push tokenization
        if: needs.changes.outputs.tokenization == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend/tokenization-service
          file: ./backend/tokenization-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-tokenization:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-tokenization:${{ github.sha }}
          cache-from: type=gha,scope=tokenization
          cache-to: type=gha,mode=max,scope=tokenization

  # ============================================================
  # JOB 3 — Deploy to VPS (runs after all builds complete)
  # ============================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [changes, build-frontend, build-main-api, build-payment-api, build-infra]
    # Run deploy if ANY build ran, even if some were skipped
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      (needs.build-frontend.result == 'success' ||
       needs.build-main-api.result == 'success' ||
       needs.build-payment-api.result == 'success' ||
       needs.build-infra.result == 'success') &&
      !contains(needs.*.result, 'failure')
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Copy docker-compose.prod.yml + migrations to VPS
      - name: Sync files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "docker/docker-compose.prod.yml,init_database.sql/schema.sql,init_database.sql/seed.sql,init_database.sql/db-migrate.sh,init_database.sql/migrations/,payment_init_database.sql/"
          target: "/root/services/FinalYear/"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GIT_SHA: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          # Pass change flags to only pull changed images
          CHANGED_FRONTEND: ${{ needs.changes.outputs.frontend }}
          CHANGED_MAIN_API: ${{ needs.changes.outputs.main-api }}
          CHANGED_PAYMENT_API: ${{ needs.changes.outputs.payment-api }}
          CHANGED_AI: ${{ needs.changes.outputs.ai-service }}
          CHANGED_DB: ${{ needs.changes.outputs.db-migrator }}
          CHANGED_TOKEN: ${{ needs.changes.outputs.tokenization }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          envs: GIT_SHA,DOCKERHUB_USERNAME,CHANGED_FRONTEND,CHANGED_MAIN_API,CHANGED_PAYMENT_API,CHANGED_AI,CHANGED_DB,CHANGED_TOKEN
          command_timeout: 12m
          script: |
            set -e
            echo "=============================================="
            echo "  DEPLOYING commit: ${GIT_SHA:0:7}"
            echo "  $(date '+%Y-%m-%d %H:%M:%S')"
            echo "=============================================="

            cd /root/services/FinalYear/docker

            TAG_ENV_FILE=".image-tags.env"
            touch "$TAG_ENV_FILE"

            set_tag() {
              local key="$1"
              local value="$2"
              if grep -q "^${key}=" "$TAG_ENV_FILE" 2>/dev/null; then
                sed -i "s/^${key}=.*/${key}=${value}/" "$TAG_ENV_FILE"
              else
                echo "${key}=${value}" >> "$TAG_ENV_FILE"
              fi
            }

            load_image_tags() {
              set -a
              [ -f "$TAG_ENV_FILE" ] && . "./$TAG_ENV_FILE"
              set +a
            }

            load_runtime_env() {
              set -a
              [ -f ".env" ] && . "./.env"
              set +a
            }

            # ── Step 1: Pull ONLY changed images ─────────────────────
            echo ""
            echo "[1/3] Pulling changed Docker images..."
            if [ "$CHANGED_FRONTEND" = "true" ]; then
              docker pull ${DOCKERHUB_USERNAME}/marketplace-frontend:${GIT_SHA}
              set_tag FRONTEND_IMAGE_TAG ${GIT_SHA}
            fi
            if [ "$CHANGED_MAIN_API" = "true" ]; then
              docker pull ${DOCKERHUB_USERNAME}/marketplace-main-api:${GIT_SHA}
              set_tag MAIN_API_IMAGE_TAG ${GIT_SHA}
            fi
            if [ "$CHANGED_PAYMENT_API" = "true" ]; then
              docker pull ${DOCKERHUB_USERNAME}/marketplace-payment-api:${GIT_SHA}
              set_tag PAYMENT_API_IMAGE_TAG ${GIT_SHA}
            fi
            if [ "$CHANGED_AI" = "true" ]; then
              docker pull ${DOCKERHUB_USERNAME}/marketplace-ai-service:${GIT_SHA}
              set_tag AI_SERVICE_IMAGE_TAG ${GIT_SHA}
            fi
            if [ "$CHANGED_DB" = "true" ]; then
              docker pull ${DOCKERHUB_USERNAME}/marketplace-db-migrator:${GIT_SHA}
              set_tag DB_MIGRATOR_IMAGE_TAG ${GIT_SHA}
            fi
            if [ "$CHANGED_TOKEN" = "true" ]; then
              docker pull ${DOCKERHUB_USERNAME}/marketplace-tokenization:${GIT_SHA}
              set_tag TOKENIZATION_IMAGE_TAG ${GIT_SHA}
            fi
            load_image_tags
            echo "✓ Images pulled and pinned to commit ${GIT_SHA:0:7}"

            # ── Step 2: Run DB migrations (if schema changed) ────────
            if [ "$CHANGED_DB" = "true" ]; then
              echo ""
              echo "[2/3] Running DB migrations..."
              docker rm -f marketplace-db-migrator 2>/dev/null || true

              docker compose -f docker-compose.prod.yml --env-file .env \
                up -d --no-deps db-migrator

              echo "  Waiting for migrator to finish (max 90s)..."
              WAITED=0
              while docker ps --filter "name=marketplace-db-migrator" --filter "status=running" \
                    | grep -q "db-migrator" 2>/dev/null; do
                sleep 3; WAITED=$((WAITED+3))
                echo -n "."
                [ $WAITED -ge 90 ] && { echo ""; echo "⚠ Migrator timeout"; break; }
              done
              echo ""

              echo "=== Migration logs ==="
              docker logs marketplace-db-migrator 2>&1 | tail -25
              echo "====================="

              echo ""
              echo "=== Applying payment_db migrations ==="
              load_runtime_env
              PAYMENT_DB_CONTAINER="marketplace-payment-postgres"
              PAYMENT_DB_NAME="payment_db"
              PAYMENT_MIGRATIONS="
                ../payment_init_database.sql/02_add_tx_hash_unique.sql
                ../payment_init_database.sql/03_payment_event_infra.sql
                ../payment_init_database.sql/04_payment_batch_session_infra.sql
              "

              for f in $PAYMENT_MIGRATIONS; do
                if [ ! -f "$f" ]; then
                  echo "  Skipping missing payment migration: $f"
                  continue
                fi

                echo "  → Applying $(basename "$f") to ${PAYMENT_DB_NAME}"
                docker exec -i "$PAYMENT_DB_CONTAINER" \
                  env PGPASSWORD="${POSTGRES_PASSWORD}" \
                  psql -U "${POSTGRES_USER:-postgres}" -d "${PAYMENT_DB_NAME}" -v ON_ERROR_STOP=1 \
                  < "$f"
              done
              echo "=== payment_db migrations complete ==="
            else
              echo "[2/3] No DB changes — skipping migrations"
            fi

            # ── Step 3: Restart ONLY changed services ────────────────
            echo ""
            echo "[3/3] Restarting changed services..."

            RESTART_SERVICES=""
            [ "$CHANGED_FRONTEND" = "true" ] && RESTART_SERVICES="$RESTART_SERVICES frontend"
            [ "$CHANGED_MAIN_API" = "true" ] && RESTART_SERVICES="$RESTART_SERVICES main-api"
            [ "$CHANGED_PAYMENT_API" = "true" ] && RESTART_SERVICES="$RESTART_SERVICES payment-api"
            [ "$CHANGED_AI" = "true" ] && RESTART_SERVICES="$RESTART_SERVICES ai-service"
            [ "$CHANGED_TOKEN" = "true" ] && RESTART_SERVICES="$RESTART_SERVICES tokenization-service"

            if [ -n "$RESTART_SERVICES" ]; then
              # Stop specific containers first
              for svc in $RESTART_SERVICES; do
                docker compose -f docker-compose.prod.yml --env-file .env \
                  up -d --no-deps --force-recreate $svc || true
              done
              echo "✓ Restarted: $RESTART_SERVICES"
            else
              echo "No services to restart"
            fi

            # Remove manual override file
            rm -f /root/services/FinalYear/docker/docker-compose.override.yml

            sleep 15

            # ── Health checks ─────────────────────────────────────────
            echo ""
            echo "=== Health checks ==="
            curl -sf http://127.0.0.1:3001/health > /dev/null \
              && echo "✅ main-api :3001 OK" || echo "❌ main-api :3001 FAIL"
            curl -sf http://127.0.0.1:3002/health > /dev/null \
              && echo "✅ payment-api :3002 OK" || echo "❌ payment-api :3002 FAIL"
            curl -sf http://127.0.0.1:3000 > /dev/null \
              && echo "✅ frontend :3000 OK" || echo "❌ frontend :3000 FAIL"

            echo ""
            echo "=== Container status ==="
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' | grep marketplace

            echo ""
            echo "=== Active pinned tags ==="
            cat "$TAG_ENV_FILE"

            # Cleanup dangling images
            docker image prune -f --filter "until=24h" || true

            echo ""
            echo "=============================================="
            echo "  ✅ DEPLOYMENT DONE — ${GIT_SHA:0:7}"
            echo "  🌐 https://kienai.id.vn"
            echo "=============================================="

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deploy OK — commit ${GITHUB_SHA:0:7} live at kienai.id.vn"
          else
            echo "❌ Deploy FAILED — commit ${GITHUB_SHA:0:7} — check Actions logs"
          fi
