name: CI/CD — Test, Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  TEST_DB_USER: testuser
  TEST_DB_PASSWORD: testpassword
  TEST_DB_NAME: marketplace_test
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ============================================================
  # JOB 1 — Run tests
  # ============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/marketplace_test
      NODE_ENV: test
      JWT_SECRET: ci_test_jwt_secret_at_least_32_characters_xxx
      JWT_REFRESH_SECRET: ci_test_refresh_secret_at_least_32_chars_xxx
      HCAPTCHA_SECRET: test_bypass
      PORT: 3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/main-service/package-lock.json

      - name: Install psql client
        run: sudo apt-get install -y postgresql-client

      - name: Apply database schema
        run: |
          PGPASSWORD=testpassword psql \
            -h localhost -U testuser -d marketplace_test \
            -f init_database.sql/01_schema.sql
          echo "Schema applied."

      - name: Install main-service dependencies
        working-directory: backend/main-service
        run: npm ci

      - name: TypeScript compile check
        working-directory: backend/main-service
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: backend/main-service
        run: echo "Tests skipped"

  # ============================================================
  # JOB 2 — Build & Push Docker images
  # ============================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push main-api
        uses: docker/build-push-action@v5
        with:
          context: ./backend/main-service
          file: ./backend/main-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-main-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-main-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push payment-api
        uses: docker/build-push-action@v5
        with:
          context: ./backend/payment-service
          file: ./backend/payment-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-payment-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-payment-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 3 — Deploy to VPS via SSH
  # ============================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose & SQL files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "init_database.sql/,docs/,docker/docker-compose.prod.yml"
          target: "/root/services/FinalYear/"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          envs: HUB_USER,GIT_SHA
          command_timeout: 10m
          script: |
            set -e
            COMPOSE_DIR="/root/services/FinalYear/docker"
            COMPOSE_FILE="$COMPOSE_DIR/docker-compose.prod.yml"

            echo "======================================"
            echo "  DEPLOYING commit: $GIT_SHA"
            echo "  DOCKERHUB: $HUB_USER"
            echo "======================================"

            cd "$COMPOSE_DIR"

            # ── Step 1: Pull latest images
            echo "[1/5] Pulling latest Docker images..."
            docker pull "$HUB_USER/marketplace-main-api:latest"
            docker pull "$HUB_USER/marketplace-payment-api:latest"
            docker pull "$HUB_USER/marketplace-frontend:latest"
            echo "✓ Images pulled"

            # ── Step 2: Ensure infra (postgres, redis, rabbitmq) is running
            echo "[2/5] Ensuring infrastructure containers are healthy..."
            docker compose -f "$COMPOSE_FILE" up -d --no-recreate postgres redis rabbitmq

            # ── Step 3: Wait for postgres
            echo "[3/5] Waiting for postgres to be healthy..."
            for i in $(seq 1 24); do
              if docker compose -f "$COMPOSE_FILE" ps postgres | grep -q "healthy"; then
                echo "✓ Postgres is healthy (attempt $i)"
                break
              fi
              echo "  Waiting... ($i/24)"
              sleep 5
            done

            # ── Step 4: Restart app services with new images
            echo "[4/5] Restarting app services with new images..."
            docker compose -f "$COMPOSE_FILE" up -d \
              --force-recreate \
              --no-deps \
              --remove-orphans \
              main-api payment-api frontend
            echo "✓ Containers restarted"

            # ── Step 5: Health checks
            echo "[5/5] Running health checks..."
            sleep 15

            if curl -sf http://127.0.0.1:3001/health > /dev/null; then
              echo "✓ main-api: HEALTHY"
            else
              echo "✗ main-api: FAILED"
              docker compose -f "$COMPOSE_FILE" logs --tail=50 main-api
              exit 1
            fi

            if curl -sf http://127.0.0.1:3002/health > /dev/null; then
              echo "✓ payment-api: HEALTHY"
            else
              echo "✗ payment-api: FAILED"
              docker compose -f "$COMPOSE_FILE" logs --tail=30 payment-api
              exit 1
            fi

            FRONTEND_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000 || echo "000")
            if [ "$FRONTEND_CODE" = "200" ] || [ "$FRONTEND_CODE" = "307" ]; then
              echo "✓ frontend: HTTP $FRONTEND_CODE"
            else
              echo "✗ frontend: HTTP $FRONTEND_CODE"
              docker compose -f "$COMPOSE_FILE" logs --tail=30 frontend
              exit 1
            fi

            # ── Cleanup old images
            docker image prune -f --filter "until=24h" || true

            echo ""
            echo "======================================"
            echo "  ✅ DEPLOYMENT SUCCESSFUL!"
            echo "======================================"
            docker compose -f "$COMPOSE_FILE" ps

      - name: Notify deployment status
        if: always()
        run: |
          STATUS="${{ job.status }}"
          SHA_SHORT="${{ github.sha }}"
          SHA_SHORT="${SHA_SHORT:0:7}"
          if [ "$STATUS" = "success" ]; then
            echo "✅ Deploy OK — commit $SHA_SHORT is live on kienai.id.vn"
          else
            echo "❌ Deploy FAILED — commit $SHA_SHORT"
          fi
