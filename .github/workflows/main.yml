name: CI/CD — Test, Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  TEST_DB_USER: testuser
  TEST_DB_PASSWORD: testpassword
  TEST_DB_NAME: marketplace_test
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ============================================================
  # JOB 1 — Run tests with clean schema
  # ============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/marketplace_test
      NODE_ENV: test
      JWT_SECRET: ci_test_jwt_secret_at_least_32_characters_xxx
      JWT_REFRESH_SECRET: ci_test_refresh_secret_at_least_32_chars_xxx
      HCAPTCHA_SECRET: test_bypass
      PORT: 3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/main-service/package-lock.json

      - name: Install psql client
        run: sudo apt-get install -y postgresql-client

      - name: Apply consolidated schema (schema.sql + seed.sql)
        run: |
          echo "Applying schema..."
          PGPASSWORD=testpassword psql \
            -h localhost -U testuser -d marketplace_test \
            -f init_database.sql/schema.sql
          echo "Applying seed data..."
          PGPASSWORD=testpassword psql \
            -h localhost -U testuser -d marketplace_test \
            -f init_database.sql/seed.sql
          echo "✓ Database initialized with consolidated schema + seed"

      - name: Verify schema
        run: |
          TABLE_COUNT=$(PGPASSWORD=testpassword psql -h localhost -U testuser -d marketplace_test -t -A \
            -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';")
          echo "Tables created: $TABLE_COUNT"
          # Verify critical columns exist
          PGPASSWORD=testpassword psql -h localhost -U testuser -d marketplace_test -c \
            "SELECT column_name FROM information_schema.columns WHERE table_name='products' AND column_name IN ('token_id','price_in_token','low_stock_threshold');" | grep -q "token_id"
          echo "✓ Schema verified: all critical columns present"

      - name: Install main-service dependencies
        working-directory: backend/main-service
        run: npm ci

      - name: TypeScript compile check
        working-directory: backend/main-service
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: backend/main-service
        run: echo "Tests skipped — add jest tests here"

  # ============================================================
  # JOB 2 — Build & Push Docker images
  # ============================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push main-api
        uses: docker/build-push-action@v5
        with:
          context: ./backend/main-service
          file: ./backend/main-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-main-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-main-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push payment-api
        uses: docker/build-push-action@v5
        with:
          context: ./backend/payment-service
          file: ./backend/payment-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-payment-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-payment-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push ai-service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/ai-service
          file: ./backend/ai-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-ai-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-ai-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 3 — Deploy to VPS with automatic DB migration
  # ============================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Copy deploy script + SQL migration files to VPS
      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "scripts/deploy_manual.sh,init_database.sql/schema.sql,init_database.sql/seed.sql,init_database.sql/migrate.sh"
          target: "/root/services/FinalYear/"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          envs: GIT_SHA
          command_timeout: 12m
          script: |
            set -e
            echo "======================================"
            echo "  DEPLOYING commit: ${GIT_SHA:0:7}"
            echo "======================================"

            # ── Step 1: DB Migration (idempotent, safe to re-run)
            echo "[1/3] Running DB migration..."
            MIGRATE=/root/services/FinalYear/init_database.sql/migrate.sh
            if [ -f "$MIGRATE" ]; then
              chmod +x "$MIGRATE"
              bash "$MIGRATE" && echo "✓ DB migration OK" || echo "⚠ Migration warning (tables may already exist)"
            else
              echo "⚠ migrate.sh not found, skipping"
            fi

            # ── Step 2: Pull new images in parallel (built on GitHub Actions, NOT on VPS)
            echo "[2/3] Pulling new Docker images (parallel)..."
            docker pull kiendzpro/marketplace-main-api:latest &
            PULL_MAIN=$!
            docker pull kiendzpro/marketplace-payment-api:latest &
            PULL_PAY=$!
            docker pull kiendzpro/marketplace-frontend:latest &
            PULL_FE=$!
            wait $PULL_MAIN && echo "✓ main-api pulled" || echo "✗ main-api pull failed"
            wait $PULL_PAY && echo "✓ payment-api pulled" || echo "✗ payment-api pull failed"
            wait $PULL_FE && echo "✓ frontend pulled" || echo "✗ frontend pull failed"

            # ── Step 3: Restart containers using deploy script
            echo "[3/3] Restarting containers..."
            DEPLOY=/root/services/FinalYear/scripts/deploy_manual.sh
            chmod +x "$DEPLOY"
            # Run WITHOUT 'pull' arg since we already pulled above
            bash "$DEPLOY"

            # ── Cleanup old images (keep disk usage low on small VPS)
            echo "Cleaning up old images..."
            docker image prune -f --filter "until=24h" || true

            echo ""
            echo "======================================"
            echo "  ✅ DEPLOYMENT SUCCESSFUL!"
            echo "  Commit: ${GIT_SHA:0:7}"
            echo "  Site: https://kienai.id.vn"
            echo "======================================"

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deploy OK — commit ${GITHUB_SHA:0:7} is live on kienai.id.vn"
          else
            echo "❌ Deploy FAILED — commit ${GITHUB_SHA:0:7} — check logs above"
          fi
