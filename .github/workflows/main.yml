name: Build, Push & Deploy

on:
  push:
    branches:
      - main

jobs:
  # ============================================================
  # JOB 1: Build Docker images trên GitHub Actions và push Docker Hub
  # ============================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push main-api
        uses: docker/build-push-action@v5
        with:
          context: ./backend/main-service
          file: ./backend/main-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-main-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push payment-api
        uses: docker/build-push-action@v5
        with:
          context: ./backend/payment-service
          file: ./backend/payment-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-payment-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 2: SSH vào VPS, pull image mới và restart containers
  # ============================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push   # Chạy sau khi build xong

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          
          port: 22
          script: |
            cd /root/services/FinalYear/docker

            echo ">>> Pulling latest images from Docker Hub..."
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} \
              docker compose -f docker-compose.prod.yml pull

            echo ">>> Restarting containers with new images..."
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} \
              docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo ">>> Cleaning up dangling images..."
            docker image prune -f

            echo ">>> Deployment completed successfully!"