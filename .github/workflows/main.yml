name: CI/CD — Test, Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  TEST_DB_USER: testuser
  TEST_DB_PASSWORD: testpassword
  TEST_DB_NAME: marketplace_test
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ============================================================
  # JOB 1 — Type-check & test
  # ============================================================
  test:
    name: Test & Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/marketplace_test
      NODE_ENV: test
      JWT_SECRET: ci_test_jwt_secret_at_least_32_characters_xxx
      JWT_REFRESH_SECRET: ci_test_refresh_secret_at_least_32_chars_xxx
      HCAPTCHA_SECRET: test_bypass
      PORT: 3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/main-service/package-lock.json

      - name: Install psql client
        run: sudo apt-get install -y postgresql-client

      - name: Apply schema + migrations
        run: |
          echo "Applying base schema..."
          PGPASSWORD=testpassword psql -h localhost -U testuser -d marketplace_test \
            -f init_database.sql/schema.sql

          echo "Applying seed data..."
          PGPASSWORD=testpassword psql -h localhost -U testuser -d marketplace_test \
            -v ON_ERROR_STOP=0 -f init_database.sql/seed.sql || true

          echo "Applying versioned migrations..."
          for f in init_database.sql/migrations/*.sql; do
            echo "  → Applying $f"
            PGPASSWORD=testpassword psql -h localhost -U testuser -d marketplace_test \
              -v ON_ERROR_STOP=0 -f "$f" || true
          done
          echo "✓ Database ready"

      - name: Install main-service dependencies
        working-directory: backend/main-service
        run: npm ci

      - name: TypeScript compile — main-service
        working-directory: backend/main-service
        run: npx tsc --noEmit

      - name: Install payment-service dependencies
        working-directory: backend/payment-service
        run: npm ci

      - name: TypeScript compile — payment-service
        working-directory: backend/payment-service
        run: npx tsc --noEmit

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript compile — frontend
        working-directory: frontend
        run: npx tsc --noEmit

  # ============================================================
  # JOB 2 — Build & Push ALL Docker images (parallel)
  # ============================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push main-api
        uses: docker/build-push-action@v5
        with:
          context: ./backend/main-service
          file: ./backend/main-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-main-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-main-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push payment-api
        uses: docker/build-push-action@v5
        with:
          context: ./backend/payment-service
          file: ./backend/payment-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-payment-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-payment-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push ai-service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/ai-service
          file: ./backend/ai-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-ai-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-ai-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── db-migrator: MUST be built last (depends on migrations/*.sql)
      - name: Build & Push db-migrator
        uses: docker/build-push-action@v5
        with:
          context: ./init_database.sql
          file: ./init_database.sql/Dockerfile.migrator
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-db-migrator:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-db-migrator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 3 — Deploy to VPS with automatic DB migration
  # ============================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Copy docker-compose.prod.yml + migrations to VPS
      - name: Sync files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "docker/docker-compose.prod.yml,init_database.sql/schema.sql,init_database.sql/seed.sql,init_database.sql/db-migrate.sh,init_database.sql/migrations/"
          target: "/root/services/FinalYear/"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GIT_SHA: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          envs: GIT_SHA,DOCKERHUB_USERNAME
          command_timeout: 12m
          script: |
            set -e
            echo "=============================================="
            echo "  DEPLOYING commit: ${GIT_SHA:0:7}"
            echo "  $(date '+%Y-%m-%d %H:%M:%S')"
            echo "=============================================="

            cd /root/services/FinalYear/docker

            # ── Step 1: Pull new images in parallel ─────────────────────
            echo ""
            echo "[1/3] Pulling Docker images..."
            docker pull ${DOCKERHUB_USERNAME}/marketplace-db-migrator:latest &
            docker pull ${DOCKERHUB_USERNAME}/marketplace-main-api:latest &
            docker pull ${DOCKERHUB_USERNAME}/marketplace-payment-api:latest &
            docker pull ${DOCKERHUB_USERNAME}/marketplace-frontend:latest &
            docker pull ${DOCKERHUB_USERNAME}/marketplace-ai-service:latest &
            wait
            echo "✓ All images pulled"

            # ── Step 2: Remove old migrator (restart: no containers don't auto-remove)
            echo ""
            echo "[2/3] Running DB migrations..."
            docker rm -f marketplace-db-migrator 2>/dev/null || true

            # Up migrator only first, wait for it
            docker compose -f docker-compose.prod.yml --env-file .env \
              up -d --no-deps db-migrator

            echo "  Waiting for migrator to finish (max 90s)..."
            WAITED=0
            while docker ps --filter "name=marketplace-db-migrator" --filter "status=running" \
                  | grep -q "db-migrator" 2>/dev/null; do
              sleep 3; WAITED=$((WAITED+3))
              echo -n "."
              [ $WAITED -ge 90 ] && { echo ""; echo "⚠ Migrator timeout"; break; }
            done
            echo ""

            echo "=== Migration logs ==="
            docker logs marketplace-db-migrator 2>&1 | tail -25
            echo "====================="

            # ── Step 3: Restart all services ────────────────────────────
            echo ""
            echo "[3/3] Restarting all services..."
            docker compose -f docker-compose.prod.yml --env-file .env \
              up -d --remove-orphans

            # Wait for services to be healthy
            sleep 20

            # ── Health checks ─────────────────────────────────────────────
            echo ""
            echo "=== Health checks ==="
            curl -sf http://127.0.0.1:3001/health > /dev/null \
              && echo "✅ main-api :3001 OK" || echo "❌ main-api :3001 FAIL"
            curl -sf http://127.0.0.1:3002/health > /dev/null \
              && echo "✅ payment-api :3002 OK" || echo "❌ payment-api :3002 FAIL"
            curl -sf http://127.0.0.1:3000 > /dev/null \
              && echo "✅ frontend :3000 OK" || echo "❌ frontend :3000 FAIL"

            echo ""
            echo "=== Container status ==="
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' | grep marketplace

            # Cleanup dangling images
            docker image prune -f --filter "until=24h" || true

            echo ""
            echo "=============================================="
            echo "  ✅ DEPLOYMENT DONE — ${GIT_SHA:0:7}"
            echo "  🌐 https://kienai.id.vn"
            echo "=============================================="

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deploy OK — commit ${GITHUB_SHA:0:7} live at kienai.id.vn"
          else
            echo "❌ Deploy FAILED — commit ${GITHUB_SHA:0:7} — check Actions logs"
          fi
