version: '3.8'

services:
  # =================================
  # Databases
  # =================================
  
  postgres:
    image: postgres:16-alpine
    container_name: tokenasset-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tokenasset-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: tokenasset-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - tokenasset-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tokenasset-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - tokenasset-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: tokenasset-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - tokenasset-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =================================
  # Microservices
  # =================================

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: tokenasset-api-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tokenasset-network
    volumes:
      - ./services/api-gateway:/app
      - /app/node_modules
    restart: unless-stopped

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: tokenasset-auth-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/auth_db
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - tokenasset-network
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules
    restart: unless-stopped

  # user-service merged into auth-service
  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    container_name: tokenasset-product-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      # coin-market-service merged into product-service - using coin_market_db
      - MONGODB_URI=mongodb://mongodb:27017/product_db
      - MONGODB_DB_COIN=coin_market_db
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - tokenasset-network
    volumes:
      - ./services/product-service:/app
      - /app/node_modules
    restart: unless-stopped

  # coin-market-service merged into product-service
  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: tokenasset-order-service
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - PORT=3005
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/order_db
      # Payment service merged into order-service - VNPay config
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE:-U5CW5POH}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET:-84NWU0ONLFEQ7SQZYFUXSGRNA2PWZIJB}
      - VNPAY_URL=${VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      - VNPAY_RETURN_URL=${VNPAY_RETURN_URL:-http://localhost:3000/payment/vnpay/return}
      - VNPAY_IPN_URL=${VNPAY_IPN_URL:-http://localhost:3005/api/v1/payments/vnpay/ipn}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - tokenasset-network
    volumes:
      - ./services/order-service:/app
      - /app/node_modules
    restart: unless-stopped

  # payment-service merged into order-service

  blockchain-service:
    build:
      context: ./services/blockchain-service
      dockerfile: Dockerfile
    container_name: tokenasset-blockchain-service
    ports:
      - "3007:3007"
      - "8545:8545"
    environment:
      - NODE_ENV=development
      - PORT=3007
      - MONGODB_URI=mongodb://mongodb:27017/blockchain_db
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - tokenasset-network
    volumes:
      - ./services/blockchain-service:/app
      - /app/node_modules
      - blockchain-data:/app/data
    restart: unless-stopped

  chat-service:
    build:
      context: ./services/chat-service
      dockerfile: Dockerfile
    container_name: tokenasset-chat-service
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=development
      - PORT=3008
      # social-service merged into chat-service - using chat_db
      - MONGODB_URI=mongodb://mongodb:27017/chat_db
      - MONGODB_DB_SOCIAL=social_db
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - tokenasset-network
    volumes:
      - ./services/chat-service:/app
      - /app/node_modules
    restart: unless-stopped

  # social-service merged into chat-service

  ai-analysis-service:
    build:
      context: ./services/ai-analysis-service
      dockerfile: Dockerfile
    container_name: tokenasset-ai-analysis-service
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=development
      - PORT=3010
      - MONGODB_URI=mongodb://mongodb:27017/ai_analysis_db
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - tokenasset-network
    volumes:
      - ./services/ai-analysis-service:/app
      - /app/node_modules
    restart: unless-stopped

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: tokenasset-notification-service
    ports:
      - "3011:3011"
    environment:
      - NODE_ENV=development
      - PORT=3011
      - MONGODB_URI=mongodb://mongodb:27017/notification_db
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - tokenasset-network
    volumes:
      - ./services/notification-service:/app
      - /app/node_modules
    restart: unless-stopped

networks:
  tokenasset-network:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  rabbitmq-data:
  blockchain-data:

