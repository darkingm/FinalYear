<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0b90b"/>
      <stop offset="100%" stop-color="#e6a800"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Inner shadow -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
  <!-- Lightning bolt -->
  <path d="M17.5 4L10 17h5.5L13 28l10-14h-6z" fill="url(#bolt)" stroke="rgba(0,0,0,0.2)" stroke-width="0.3" stroke-linejoin="round"/>
  <!-- Subtle highlight on bolt -->
  <path d="M17.5 4L10 17h5.5L13 28l10-14h-6z" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.5" stroke-linejoin="round"/>
</svg>
