version: '3.8'

# ============================================================
# PRODUCTION — VPS dùng System Nginx (đã có SSL) + Docker containers
# Containers bind port ra localhost, system nginx proxy vào
# ============================================================

services:

  postgres:
    image: postgres:15-alpine
    container_name: marketplace-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../init_database.sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../init_database.sql/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-marketplace_db}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - marketplace-network
    restart: unless-stopped

  postgres-payment:
    image: postgres:15-alpine
    container_name: marketplace-payment-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: payment_db
    expose:
      - "5432"
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
      - ../payment_init_database.sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d payment_db" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - marketplace-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - marketplace-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: marketplace-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-kaitojpla}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "127.0.0.1:15672:15672"
    expose:
      - "5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - marketplace-network
    restart: unless-stopped

  main-api:
    image: ${DOCKERHUB_USERNAME}/marketplace-main-api:latest
    container_name: marketplace-main-api
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:%40Kien2909@postgres:5432/marketplace_db
      REDIS_URL: redis://:%40Kien2909@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-kaitojpla}:%40Kien2909@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_EXPIRES_IN: 7d
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: kaitojpla@gmail.com
      SMTP_PASSWORD: cltk gtwx cgek mofm
      HCAPTCHA_SECRET: ES_9a13fd597b2c4cd5a3b0ded489fd5e17
      CLOUDINARY_CLOUD_NAME: deyjlti3v
      CLOUDINARY_API_KEY: 769799281583264
      CLOUDINARY_API_SECRET: FpgAWZCGduORuwPClfJXt5d6aas
      FRONTEND_URL: https://kienai.id.vn
    ports:
      - "127.0.0.1:3001:3001" # Chỉ localhost — nginx proxy vào
    depends_on:
      postgres:
        condition: service_healthy
      postgres-payment:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - marketplace-network
    restart: unless-stopped

  payment-api:
    image: ${DOCKERHUB_USERNAME}/marketplace-payment-api:latest
    container_name: marketplace-payment-api
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://postgres:%40Kien2909@postgres-payment:5432/payment_db
      MAIN_DATABASE_URL: postgresql://postgres:%40Kien2909@postgres:5432/marketplace_db
      REDIS_URL: redis://:%40Kien2909@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-kaitojpla}:%40Kien2909@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET}
      PAYPAL_CLIENT_ID: AYxcD1jBUgx2LMY2eoXyM
      PAYPAL_SECRET: ${PAYPAL_SECRET}
      PAYPAL_MODE: sandbox
      ESCROW_CONTRACT_ADDRESS: 0xCDE08Be0190482691b3288C27240378497d74E79
      POLYGON_RPC_URL: https://polygon.drpc.org
      POLYGON_MUMBAI_RPC_URL: https://rpc-amoy.polygon.technology
      ARBITRUM_RPC_URL: https://arb1.arbitrum.io/rpc
      MORALIS_API_KEY: ${MORALIS_API_KEY:-your_moralis_api_key}
      PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY:-your_private_key_here}
      FRONTEND_URL: https://kienai.id.vn
    ports:
      - "127.0.0.1:3002:3002" # Chỉ localhost — nginx proxy vào
    depends_on:
      postgres:
        condition: service_healthy
      postgres-payment:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - marketplace-network
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME}/marketplace-frontend:latest
    container_name: marketplace-frontend
    environment:
      NODE_ENV: production
      # Public URL (browser-side fetch)
      NEXT_PUBLIC_API_URL: https://kienai.id.vn
      NEXT_PUBLIC_PAYMENT_API_URL: https://kienai.id.vn/payment
      # Internal Docker network URL for server-side calls (NextAuth, SSR)
      # This avoids routing through internet/nginx for server-to-server calls
      INTERNAL_API_URL: http://main-api:3001
      NEXT_PUBLIC_BINANCE_WS: wss://stream.binance.com:9443/ws
      NEXT_PUBLIC_HCAPTCHA_SITEKEY: fd6eea20-ea7a-42f0-8eb4-878285a04eea
      NEXT_PUBLIC_PAYPAL_CLIENT_ID: AYxcD1jBUgx2LMY2eoXyM
      NEXT_PUBLIC_POLYGON_RPC: https://polygon.drpc.org
      NEXT_PUBLIC_ESCROW_CONTRACT_POLYGON_AMOY: 0xCDE08Be0190482691b3288C27240378497d74E79
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: cea17a07a0cb8c74b022c41e21294643
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://kienai.id.vn}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: 946575631331-1p51ll7tpqd0bo1impek2nggoqjrcoo8.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: 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
      FACEBOOK_CLIENT_ID: 1497732641781702
      FACEBOOK_CLIENT_SECRET: 7bbce842d85baa3c21fca3101b42c832
      PAYPAL_SECRET: EPxefifbE6-6hPXAsqdY8jGlxcTpYRwuAjhT2aRPxWChSK0QOwIhijGbgwfRNhS2TEN2FSwSG-Mf4hhN

    ports:
      - "127.0.0.1:3000:3000" # Chỉ localhost — nginx proxy vào
    depends_on:
      - main-api
      - payment-api
    networks:
      - marketplace-network
    restart: unless-stopped

  ai-service:
    build:
      context: ../backend/ai-service
      dockerfile: Dockerfile
    container_name: marketplace-ai
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      MAIN_SERVICE_URL: http://main-api:3001
    ports:
      - "127.0.0.1:3005:3005"
    depends_on:
      - main-api
    networks:
      - marketplace-network
    restart: unless-stopped

volumes:
  postgres_data:
  payment_postgres_data:
  redis_data:
  rabbitmq_data:


networks:
  marketplace-network:
    driver: bridge




