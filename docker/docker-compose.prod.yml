# ============================================================
# PRODUCTION — VPS dùng System Nginx (đã có SSL) + Docker containers
# Containers bind port ra localhost, system nginx proxy vào
# ============================================================

services:

  postgres:
    image: postgres:15-alpine
    container_name: marketplace-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Only used on FIRST boot (when volume is empty)
      # After that, db-migrator handles all schema changes
      - ../init_database.sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../init_database.sql/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-marketplace_db}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - marketplace-network
    restart: unless-stopped

  # ─── DB Migrator ─────────────────────────────────────────────────────────────
  # Chạy MỖI LẦN deploy — tự động apply các migration chưa áp dụng
  # Sau khi xong thì thoát (restart: no) — không chiếm tài nguyên
  db-migrator:
    image: ${DOCKERHUB_USERNAME}/marketplace-db-migrator:${DB_MIGRATOR_IMAGE_TAG:-latest}
    container_name: marketplace-db-migrator
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-marketplace_db}
      MIGRATIONS_DIR: /migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - marketplace-network
    restart: "no" # Chạy 1 lần rồi thoát

  postgres-payment:
    image: postgres:15-alpine
    container_name: marketplace-payment-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: payment_db
    expose:
      - "5432"
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
      - ../payment_init_database.sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d payment_db" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - marketplace-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - marketplace-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: marketplace-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-kaitojpla}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "127.0.0.1:15672:15672"
    expose:
      - "5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - marketplace-network
    restart: unless-stopped

  main-api:
    image: ${DOCKERHUB_USERNAME}/marketplace-main-api:${MAIN_API_IMAGE_TAG:-latest}
    container_name: marketplace-main-api
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketplace_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-kaitojpla}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_EXPIRES_IN: 7d
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      HCAPTCHA_SECRET: ${HCAPTCHA_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      FRONTEND_URL: https://kienai.id.vn
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      TOKENIZATION_SERVICE_URL: http://tokenization-service:3003
      PAYMENT_SERVICE_URL: http://payment-api:3002
      # ── Smart contract integration (CreditScoreSBT on VPS Hardhat) ──
      CREDIT_SBT_ADDRESS: ${CREDIT_SBT_ADDRESS:-0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512}
      MINTER_PRIVATE_KEY: ${PRIVATE_KEY:-${BLOCKCHAIN_PRIVATE_KEY}}
      PRIVATE_KEY: ${PRIVATE_KEY:-${BLOCKCHAIN_PRIVATE_KEY}}
      LOCALHOST_RPC_URL: http://hardhat-node:8545
      POLYGON_RPC_URL: https://polygon.drpc.org
    ports:
      - "127.0.0.1:3001:3001" # Chỉ localhost — nginx proxy vào
    depends_on:
      postgres:
        condition: service_healthy
      postgres-payment:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-migrator:
        # ← Chờ migration xong mới khởi động
        condition: service_completed_successfully
    networks:
      - marketplace-network
    restart: unless-stopped

  payment-api:
    image: ${DOCKERHUB_USERNAME}/marketplace-payment-api:${PAYMENT_API_IMAGE_TAG:-latest}
    container_name: marketplace-payment-api
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres-payment:5432/payment_db
      MAIN_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketplace_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-kaitojpla}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_SECRET: ${PAYPAL_SECRET}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      LOCALHOST_RPC_URL: http://hardhat-node:8545
      ESCROW_CONTRACT_LOCALHOST: ${ESCROW_CONTRACT_LOCALHOST:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
      DEFAULT_CHAIN_ID: "31337"
      POLYGON_AMOY_RPC_URL: https://rpc-amoy.polygon.technology
      ESCROW_CONTRACT_POLYGON_AMOY: ${ESCROW_CONTRACT_POLYGON_AMOY:-0xCDE08Be0190482691b3288C27240378497d74E79}
      POLYGON_RPC_URL: https://polygon.drpc.org
      ESCROW_CONTRACT_POLYGON: 0x0
      POLYGON_MUMBAI_RPC_URL: https://rpc-mumbai.maticvigil.com
      ARBITRUM_RPC_URL: https://arb1.arbitrum.io/rpc
      BSC_TESTNET_RPC_URL: ${BSC_TESTNET_RPC_URL:-https://data-seed-prebsc-1-s1.binance.org:8545}
      ESCROW_CONTRACT_BSC_TESTNET: ${ESCROW_CONTRACT_BSC_TESTNET:-0x0}
      ESCROW_CONTRACT_ADDRESS: ${ESCROW_CONTRACT_LOCALHOST:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
      MORALIS_API_KEY: ${MORALIS_API_KEY:-}
      ADMIN_PRIVATE_KEY: ${PRIVATE_KEY:-${BLOCKCHAIN_PRIVATE_KEY}}
      PRIVATE_KEY: ${PRIVATE_KEY:-${BLOCKCHAIN_PRIVATE_KEY}}
      FRONTEND_URL: https://kienai.id.vn
    ports:
      - "127.0.0.1:3002:3002" # Chỉ localhost — nginx proxy vào
    depends_on:
      postgres:
        condition: service_healthy
      postgres-payment:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-migrator:
        # ← Chờ migration xong mới khởi động
        condition: service_completed_successfully
      hardhat-node:
        condition: service_started
    networks:
      - marketplace-network
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME}/marketplace-frontend:${FRONTEND_IMAGE_TAG:-latest}
    container_name: marketplace-frontend
    environment:
      NODE_ENV: production
      # Public URL (browser-side fetch)
      NEXT_PUBLIC_API_URL: https://kienai.id.vn
      NEXT_PUBLIC_PAYMENT_API_URL: https://kienai.id.vn/payment
      # Internal Docker network URL for server-side calls (NextAuth, SSR)
      # This avoids routing through internet/nginx for server-to-server calls
      INTERNAL_API_URL: http://main-api:3001
      AI_SERVICE_URL: http://marketplace-ai:8000
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NEXT_PUBLIC_BINANCE_WS: wss://stream.binance.com:9443/ws
      NEXT_PUBLIC_HCAPTCHA_SITEKEY: fd6eea20-ea7a-42f0-8eb4-878285a04eea
      NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      NEXT_PUBLIC_POLYGON_RPC: https://polygon.drpc.org
      # ─── Dual mode: Hardhat VPS default, Amoy fallback ───────────────
      NEXT_PUBLIC_DEFAULT_CHAIN_ID: "31337"
      NEXT_PUBLIC_TESTNET_MODE: "true"
      # Hardhat RPC is reverse-proxied via nginx /rpc/hardhat (HTTPS).
      # NEXT_PUBLIC_HARDHAT_RPC_URL is baked into the JS bundle at BUILD time
      # from the Dockerfile ARG (default: https://kienai.id.vn/rpc/hardhat).
      # Setting it as a runtime env here would NOT change the client bundle
      # and only invites mixed-content / config-drift bugs — left empty so
      # the build-arg value is the single source of truth.
      # NEXT_PUBLIC_HARDHAT_RPC_URL: (intentionally unset)
      NEXT_PUBLIC_ESCROW_CONTRACT_LOCALHOST: ${ESCROW_CONTRACT_LOCALHOST:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
      NEXT_PUBLIC_ESCROW_CONTRACT_POLYGON_AMOY: ${ESCROW_CONTRACT_POLYGON_AMOY:-0xCDE08Be0190482691b3288C27240378497d74E79}
      NEXT_PUBLIC_ESCROW_CONTRACT_POLYGON: 0x0
      NEXT_PUBLIC_RWA_MARKET_ESCROW_ADDRESS: ${RWA_MARKET_ESCROW_ADDRESS:-0x0000000000000000000000000000000000000000}
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: cea17a07a0cb8c74b022c41e21294643
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://kienai.id.vn}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET}
      PAYPAL_SECRET: ${PAYPAL_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}

    ports:
      - "127.0.0.1:3000:3000" # Chỉ localhost — nginx proxy vào
    depends_on:
      - main-api
      - payment-api
    networks:
      - marketplace-network
    restart: unless-stopped

  # ─── Hardhat Local Chain (Chain ID 31337) ─────────────────────────────
  # Chain ảo chạy ngay trên VPS — không cần token thật, test thanh toán tự do
  # RPC public-facing path: https://kienai.id.vn/rpc/hardhat (HTTPS, qua nginx
  # reverse proxy). Container chỉ bind localhost — KHÔNG mở 8545 ra internet
  # vì (a) HTTPS qua reverse proxy đã đủ cho MetaMask và (b) một public
  # JSON-RPC mở là vector spam/abuse rất rộng.
  hardhat-node:
    image: node:20-alpine
    container_name: marketplace-hardhat
    working_dir: /app
    command: >
      sh -c "npm install --prefix /app &&
             npx hardhat node --hostname 0.0.0.0 --port 8545"
    volumes:
      - ../contracts:/app
      - hardhat_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:8545:8545" # localhost only — nginx /rpc/hardhat proxies in
    networks:
      - marketplace-network
    restart: unless-stopped
    healthcheck:
      # Hardhat node: use disable to avoid BusyBox nc/wget issues.
      # Health is verified by bootstrap container which waits for RPC.
      disable: true
  # ─── Hardhat Bootstrap (chạy 1 lần để deploy EscrowCore) ──────────────
  hardhat-bootstrap:
    image: node:20-alpine
    container_name: marketplace-hardhat-bootstrap
    working_dir: /app
    command: >
      sh -c "sleep 10 &&
             npx hardhat run scripts/bootstrap-local.ts --network localhost &&
             echo 'Bootstrap done' && tail -f /dev/null"
    environment:
      LOCALHOST_RPC_URL: http://hardhat-node:8545
      # Bootstrap deploys to a LOCAL Hardhat chain only (chain id 31337).
      # If HARDHAT_BOOTSTRAP_PRIVATE_KEY is unset we fall back to the
      # well-known Hardhat account #0 — the bootstrap script also asserts
      # network=localhost before signing, so accidental mainnet usage with
      # this key is blocked at the application layer. Keeping the key out
      # of compose tracks the rule that no real-money credentials should
      # appear in this file.
      PRIVATE_KEY: ${HARDHAT_BOOTSTRAP_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
    volumes:
      - ../contracts:/app
      - hardhat_node_modules:/app/node_modules
    depends_on:
      hardhat-node:
        condition: service_started # healthcheck disabled — bootstrap uses sleep 10 to wait for RPC
    networks:
      - marketplace-network
    restart: "no"

  ai-service:
    image: ${DOCKERHUB_USERNAME}/marketplace-ai-service:${AI_SERVICE_IMAGE_TAG:-latest}
    container_name: marketplace-ai
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GROK_API_KEY: ${GROK_API_KEY:-}
      GROK_MODEL: ${GROK_MODEL:-grok-3-mini-fast}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-3-12b-it:free}
      MAIN_SERVICE_URL: http://main-api:3001
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - main-api
    networks:
      - marketplace-network
    restart: unless-stopped

  tokenization-service:
    image: ${DOCKERHUB_USERNAME}/marketplace-tokenization:${TOKENIZATION_IMAGE_TAG:-latest}
    container_name: marketplace-tokenization
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketplace_db}
      FRONTEND_URL: https://kienai.id.vn
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      LOCALHOST_RPC_URL: http://hardhat-node:8545
      ADMIN_PRIVATE_KEY: ${PRIVATE_KEY:-${BLOCKCHAIN_PRIVATE_KEY}}
      PRIVATE_KEY: ${PRIVATE_KEY:-${BLOCKCHAIN_PRIVATE_KEY}}
      RWA_FACTORY_ADDRESS: ${RWA_FACTORY_ADDRESS:-}
      COMPLIANCE_REGISTRY_ADDRESS: ${COMPLIANCE_REGISTRY_ADDRESS:-}
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    networks:
      - marketplace-network
    restart: unless-stopped

volumes:
  postgres_data:
  payment_postgres_data:
  redis_data:
  rabbitmq_data:
  hardhat_node_modules:


networks:
  marketplace-network:
    driver: bridge
