worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Hide nginx version
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # Upstream services (internal Docker network - NOT exposed to internet)
    upstream frontend {
        server frontend:3000;
    }

    upstream main_api {
        server main-api:3001;
    }

    upstream payment_api {
        server payment-api:3002;
    }

    server {
        listen 80;
        server_name kienai.id.vn www.kienai.id.vn;

        client_max_body_size 20M;

        # ── NextAuth Endpoints (trả về Frontend — ĐẶT TRƯỚC /api/) ──
        location ~ ^/api/auth/(session|csrf|signin|signout|callback|providers|error|_log) {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Main API (/api/*) ──────────────────────────────────
        # CORS is handled by Express (helmet+cors middleware in main-service)
        # using the FRONTEND_URL whitelist. Adding `Access-Control-Allow-Origin
        # *` here would (a) duplicate / conflict with the backend's headers
        # and (b) — combined with the public CORS — let any origin make
        # authenticated requests if a session cookie ever leaked. Strip it
        # and let the backend be the single source of truth.
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://main_api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Payment API (/payment/*) ───────────────────────────
        location /payment/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass         http://payment_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Frontend (Next.js — catch-all) ─────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Block access to sensitive paths ───────────────────
        location ~ /\. {
            deny all;
        }

        location ~* \.(env|log|sql|sh|bak)$ {
            deny all;
        }
    }
}
