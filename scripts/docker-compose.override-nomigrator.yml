# docker-compose.override.yml — chỉ dùng TẠM THỜI khi db-migrator image chưa có
# Xóa file này SAU khi CI/CD đã build và push db-migrator image lên Docker Hub
# File này override phần depends_on của main-api và payment-api

services:
  db-migrator:
    image: alpine:3.18
    container_name: marketplace-db-migrator
    command: echo "Migrations already applied manually — skipping"
    restart: "no"

  main-api:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-api:
    depends_on:
      postgres:
        condition: service_healthy
      postgres-payment:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
